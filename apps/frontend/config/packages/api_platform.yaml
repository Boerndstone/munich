api_platform:
  title: Munichclimbs API
  description: Read-only public climbing data for MunichClimbs.
  version: 1.0.0
  formats:
    jsonld: ["application/ld+json"]
    json: ["application/json"]
  docs_formats:
    jsonld: ["application/ld+json"]
    jsonopenapi: ["application/vnd.openapi+json"]
    html: ["text/html"]
  defaults:
    stateless: true
    cache_headers:
      max_age: 300
      shared_max_age: 300
      vary: ["Content-Type", "Authorization", "Origin"]
    extra_properties:
      standard_put: true
      rfc_7807_compliant_errors: true
  use_symfony_listeners: true
  mapping:
    # The domain model is shared by the frontend and backoffice applications.
    # API Platform does not scan this directory by default.
    paths:
      - "%kernel.project_dir%/../../packages/domain/src/Entity"
  # Set hydra_prefix to true to keep the current behavior
  serializer:
    hydra_prefix: true
