twig:
  file_name_pattern: "*.twig"
  paths:
    "%kernel.project_dir%/apps/frontend/assets/css": styles
    "%kernel.project_dir%/apps/frontend/templates": ~
    "%kernel.project_dir%/apps/backoffice/templates": ~
  globals:
    weather_api_key: "%env(default::OPENWEATHERMAP_API_KEY)%"

when@test:
  twig:
    strict_variables: true
    form_themes:
      # Align tests with public site (Tailwind); admin EasyAdmin still ships Bootstrap CSS/JS via admin entry.
      - "form/tailwind_form_layout.html.twig"
